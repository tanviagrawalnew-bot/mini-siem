<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload Logs</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .upload-error {
            background-color: #fdecea;
            color: #611a15;
            border: 1px solid #f5c6cb;
            border-radius: 6px;
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 0.95rem;
            text-align: left;
        }
    </style>

</head>

<body>

    <div class="upload-container">

        <div class="upload-card">

            <h1>Upload Security Logs</h1>

            <p>Select a log file to begin threat analysis.</p>

            {% if error %}
            <div class="upload-error">
                {{ error }}
            </div>
            {% endif %}

            <form action="/upload" method="POST" enctype="multipart/form-data">

                <input
                    type="file"
                    name="logfile"
                    accept=".txt,.log,.csv"
                    required
                >

                <button type="submit">
                    Upload & Analyze
                </button>

            </form>

        </div>

    </div>

</body>

</html>
